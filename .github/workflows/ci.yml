name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Type Checking with ty
  # =============================================================================
  type-check:
    name: Type Check (ty)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: just install

      - name: Run type checker
        run: just type-check

  # =============================================================================
  # Linting with Ruff
  # =============================================================================
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: just install

      - name: Run Ruff linter
        run: just lint

      - name: Run Ruff formatter check
        run: just format-check

      - name: Cognitive complexity (maximum 12)
        run: just complexity

  # =============================================================================
  # Tests with Pytest
  # =============================================================================
  test:
    name: Tests (Pytest)
    runs-on: ubuntu-latest

    env:
      # Nothing is provisioned by just setup here, so consent is explicit.
      WORKFLOW_ALLOW_UNPROVISIONED_DB: "1"
      APP_DB_HOST: localhost
      APP_DB_PORT: 5432
      APP_DB_USER: fastapitemplateuser
      APP_DB_PASSWORD: fastapitemplatepassword
      # Two distinct names are mandatory, with no override. Only the test
      # database is created: the application one must never be reachable here.
      APP_DB_NAME: fastapi_template_app
      APP_DB_TEST_NAME: fastapi_template_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastapitemplateuser
          POSTGRES_PASSWORD: fastapitemplatepassword
          POSTGRES_DB: fastapi_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: just install

      - name: Run tests
        run: just test-cov

  # =============================================================================
  # Migrations image smoke test
  # =============================================================================
  migrations-image:
    name: Migrations image
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastapitemplateuser
          POSTGRES_PASSWORD: fastapitemplatepassword
          POSTGRES_DB: fastapi_template_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      # The image ships only app/ and alembic/, so an env.py import outside those
      # breaks it in a way no lint, type check or test suite can observe.
      - name: Build the migrations image
        run: docker build --target migrations -t fastapi-template:migrations .

      - name: Run the migrations image
        run: |
          docker run --rm --network host \
            -e APP_DB_HOST=localhost \
            -e APP_DB_PORT=5432 \
            -e APP_DB_USER=fastapitemplateuser \
            -e APP_DB_PASSWORD=fastapitemplatepassword \
            -e APP_DB_NAME=fastapi_template_migrations \
            -e SECRET_KEY=ci-smoke-test-not-for-production \
            fastapi-template:migrations
