[project]
name = "fastapi-template"
version = "2.0.0-rc.1"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "authx>=1.7.1",
    "factory-boy>=3.3.3",
    "faker>=40.1.0",
    "fastapi[standard]>=0.133.0",
    "logfire[fastapi,sqlalchemy]>=4.25.0",
    "prefect>=3.6.10",
    "prefect-docker>=0.7.1",
    "prefect-sqlalchemy>=0.5.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.12.0",
    "pydantic[email,timezone]>=2.12.5",
    "pyjwt>=2.10.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.45",
    "sqlalchemy-utils>=0.42.1",
    "uvicorn>=0.40.0",
]

[build-system]
# Needed so uv can build the project in editable mode (to expose [project.scripts]).
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
# IMPORTANT: Explicitly limit package discovery to `app` only.
# This avoids setuptools trying to treat `alembic/` and `var/` as top-level packages.

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "var*"]

[dependency-groups]
dev = [
    "alembic>=1.17.2",
    "ast-grep-cli>=0.45.3",
    "asyncpg>=0.31.0",
    "complexipy>=8.0.1",
    "import-linter>=2.15",
    "prek<=0.3.4",
    "pyjwt>=2.11.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "python-semantic-release>=9.17.0",
    "pyyaml>=6.0.3",
    "ruff>=0.14.11",
    "ty>=0.0.10",
]


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F", "B", "UP", "I", "B", "C901"]
ignore = []

# Ruff options belong to the lint table, not the complexipy table.
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.complexipy]
paths = ["app", "tests", "scripts", "features", "conftest.py"]
cache-dir = ".complexipy_cache"
failed = true
max-complexity-allowed = 12

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends()`/`Security()` in argument defaults is the framework's
# idiomatic DI pattern, not the mutable-default-argument bug B008 targets.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# Test DB env must be set before importing the app (see root conftest.py).
"conftest.py" = ["E402"]
# Architecture fixtures contain deliberate violations; linting them defeats them.
"tests/architecture/fixtures/**" = ["F401", "E402"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests", "features"]
markers = [
    "unit: no database or external calls",
    "integration: requires real PostgreSQL",
    "bdd: Gherkin scenario",
    "architecture: structural invariant, no database",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

# =============================================================================
# Import Linter: the architecture contracts (just architecture-check)
# =============================================================================
[tool.importlinter]
root_package = "app"
include_external_packages = true
# Declared explicitly rather than relied on as import-linter's default (AC-05): an
# ignore_imports entry matching nothing must fail, so a stale exemption can't
# accumulate silently.
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Domains are framework-agnostic"
type = "forbidden"
source_modules = ["app.domains"]
forbidden_modules = ["fastapi", "starlette", "prefect"]

[[tool.importlinter.contracts]]
name = "Workers never import the HTTP API"
type = "forbidden"
source_modules = ["app.workers"]
forbidden_modules = ["app.api"]

# Higher to lower. Delivery adapters on top; infrastructure at the bottom, which is
# why the auth adapter moved out of it (feature.md D1). `users` sits below
# `sessions`: a refresh session belongs to a user, never the reverse (D2).
[[tool.importlinter.contracts]]
name = "Application layers"
type = "layers"
layers = [
    "app.api | app.workers",
    "app.domains.sessions",
    "app.domains.users",
    "app.domains.base",
    "app.infrastructure",
]

# One contract per domain, deliberately not a wildcard: with
# `allowed_importers = app.domains.*` every domain is its own allow-list, so a real
# cross-domain import reports KEPT. Measured before writing this.
[[tool.importlinter.contracts]]
name = "The users repository is private to its domain"
type = "protected"
protected_modules = ["app.domains.users.repository"]
allowed_importers = ["app.domains.users"]

[[tool.importlinter.contracts]]
name = "The sessions repository is private to its domain"
type = "protected"
protected_modules = ["app.domains.sessions.repository"]
allowed_importers = ["app.domains.sessions"]

[tool.ty.src]
include = ["app"]
exclude = ["app/scripts/*"]

[project.scripts]
generate-user = "app.scripts.generate_user:cli"
init-prefect = "app.scripts.init_prefect:cli"
serve-flows = "app.scripts.serve_flows:cli"

# Pydantic Logfire: instrument Pydantic validation (traces + metrics)
# Overridable via env LOGFIRE_PYDANTIC_PLUGIN_RECORD (e.g. "failure", "metrics", "off")
[tool.logfire]
pydantic_plugin_record = "all"
pydantic_plugin_exclude = ["app.infrastructure"]

# =============================================================================
# Python Semantic Release Configuration
# =============================================================================
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "chore(release): {version}"
tag_format = "v{version}"
build_command = ""

# Prerelease (RC) configuration for main branch
[tool.semantic_release.branches.main]
match = "main"
prerelease = true
prerelease_token = "rc"

# Changelog generation
[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

# Don't auto-detect version from commits (manual control)
[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

# Commitizen: validate commit messages (Conventional Commits), aligned with semantic_release
[tool.commitizen]
name = "cz_conventional_commits"
