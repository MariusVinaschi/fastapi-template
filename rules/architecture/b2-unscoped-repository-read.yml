# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: b2-unscoped-repository-read
message: >
  Custom read must call self._apply_user_scope(query) before executing, or declare
  the deliberate system-only bypass with self._require_system() (AC-B2).

  This is a SYNTACTIC contract, not a proof of authorization: it checks that the
  scoping ritual is present in the method body, nothing more. It cannot and does not
  establish that every execution path is correctly scoped — that needs type
  resolution, data flow and call-graph analysis this rule does not perform. Passing
  this rule is never evidence that a query is safe.
severity: error
language: Python
files:
  - "app/domains/**/repository.py"
rule:
  kind: call
  pattern: select($$$ARGS)
  inside:
    kind: function_definition
    stopBy: end
  not:
    # `inside` with stopBy:end matches if ANY enclosing function -- not only the
    # nearest one -- satisfies this shape. A select() built inside a nested helper
    # is still "scoped" if the outer method (a further-out ancestor) applies the
    # scope call; anchoring only to the nearest ancestor would miss that and flag a
    # correctly scoped read (verified against a nested-helper fixture).
    inside:
      kind: function_definition
      stopBy: end
      has:
        stopBy: end
        any:
          - pattern: self._apply_user_scope($$$)
          - pattern: self._require_system()
