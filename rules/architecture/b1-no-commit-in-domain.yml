# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: b1-no-commit-in-domain
message: >
  Repositories and services flush, never commit (AC-B1). The transaction boundary
  belongs to the caller: once per HTTP request, once per Prefect flow.
severity: error
language: Python
files:
  - "app/domains/**/repository.py"
  - "app/domains/**/service.py"
rule:
  pattern: self.session.commit($$$ARGS)
